[mgr]
show_hidden = true
sort_dir_first = true
show_symlink = true
mouse_events = ["scroll", "touch", "click"]

[manager]
linemode="git"

[opener]
edit = [
    {run="nvim %s", orphan=false, block=true,for="unix"}
]

open_dir = [
    {run="zed %s", orphan=true, block=false, for="unix"}
]

open_vid = [
    {run="vlc %s", orphan=true, block=false, for="unix"}
]

open_img = [
    {run="qimgv %s", orphan=true, block=false, for="unix"}
]

open_audio = [
    {run="fooyin %s", orphan=true, block=false, for="unix"}
]

open_pdf = [
    {run="Stirling-PDF %s", orphan=true, block=false, for="unix"}
]

open_office = [
    {run="soffice %s", orphan=true, block=false, for="unix"}
]

[open]
rules = [
    {mime="folder/*", use="open_dir"},
    {mime="text/*", use="edit"},
    {mime="video/*", use="open_vid"},
    {mime="image/*", use="open_img"},
    {mime="audio/*", use="open_audio"},
    {mime="application/pdf", use="open_pdf"},

    # Office documents
    {url="*.xlsx", use="open_office"},
    {url="*.ods", use="open_office"},
    {url="*.odt", use="open_office"},
    {url="*.doc", use="open_office"},
    {url="*.docx", use="open_office"},
]

[plugin]

[[plugin.prepend_fetchers]]
id="git"
url="*"
run="git"
group="git"

[[plugin.prepend_fetchers]]
id="git"
url="/*"
run="git"
group="git"

[[plugin.prepend_previewers]]

# Markdown Preview
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
